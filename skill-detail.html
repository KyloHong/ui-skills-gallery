<script>
// ============================================================
// 详情页逻辑
// ============================================================

let currentSkill = null;
let currentTab = 'experience';

// 从 URL 获取 skill id
function getSkillIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

// 初始化
function init() {
  const skillId = getSkillIdFromUrl();
  if (!skillId) {
    document.getElementById('skillHero').querySelector('.detail-container').innerHTML = 
      '<p class="text-stone-500">未指定 skill</p><a href="index.html" class="text-orange-600 underline">返回首页</a>';
    return;
  }
  
  currentSkill = skills.find(s => s.id === skillId);
  if (!currentSkill) {
    document.getElementById('skillHero').querySelector('.detail-container').innerHTML = 
      '<p class="text-stone-500">未找到 skill: ' + skillId + '</p><a href="index.html" class="text-orange-600 underline">返回首页</a>';
    return;
  }
  
  // 初始化演示评价记录
  initDemoRecords();

  
  document.title = currentSkill.name + ' - UI Skills Gallery';
  renderSkillHero();
  switchTab('experience');
  lucide.createIcons();
}

// 渲染 Skill 信息区
function renderSkillHero() {
  const s = currentSkill;
  const tagsHtml = (s.tags || []).map(t => 
    `<span class="text-[11px] px-2 py-0.5 rounded-full ${t.color || 'bg-stone-100 text-stone-600'}">${t.name || t}</span>`
  ).join('');
  
  const suitableForHtml = (s.suitableFor || []).map(item => 
    `<span class="text-[11px] px-2.5 py-1 rounded-md bg-white border border-stone-200 text-stone-600">${item.type || item}</span>`
  ).join('');
  
  document.getElementById('skillHero').querySelector('.detail-container').innerHTML = `
    <div class="flex items-center gap-2 mb-3">
      ${tagsHtml}
      <span class="text-[11px] text-stone-400 font-mono">v${s.version || '1.0.0'}</span>
${s.author ? `<span class="text-[11px] text-stone-600 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i>${s.author}</span>` : ''}
      ${s.addedDate ? `<span class="text-[11px] text-stone-400 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${s.addedDate}</span>` : ''}
    </div>
    <div class="skill-title-row">
      <h1 class="skill-title">${s.name}</h1>
      <div class="skill-links">
        ${s.github ? `<a href="${s.github}" target="_blank" class="skill-link-btn skill-link-github">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          ${parseStars(s.stars) || 'Star'}
        </a>` : ''}
        ${s.website ? `<a href="${s.website}" target="_blank" class="skill-link-btn skill-link-website">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          官网
        </a>` : ''}
      </div>
    </div>
    ${s.officialIntro ? `<p class="text-sm text-stone-600 leading-relaxed mb-4 max-w-4xl">${s.officialIntro}</p>` : ''}
    ${s.plainDesc ? `<div class="bg-orange-50 border border-orange-100 rounded-lg p-3 mb-4 max-w-4xl">
      <span class="text-[11px] font-semibold text-orange-600">大白话</span>
      <p class="text-sm text-stone-700 mt-1">${s.plainDesc}</p>
    </div>` : ''}
    ${suitableForHtml ? `<div class="flex flex-wrap gap-2">
      <span class="text-[11px] font-semibold text-stone-400 uppercase tracking-wider py-1">适合做什么</span>
      ${suitableForHtml}
    </div>` : ''}
  `;
}

// 初始化
function init() {
  const skillId = getSkillIdFromUrl();
  if (!skillId) {
    document.getElementById('skillHero').querySelector('.detail-container').innerHTML = 
      '<p class="text-stone-500">未指定 skill</p><a href="index.html" class="text-orange-600 underline">返回首页</a>';
    return;
  }
  
  currentSkill = skills.find(s => s.id === skillId);
  if (!currentSkill) {
    document.getElementById('skillHero').querySelector('.detail-container').innerHTML = 
      '<p class="text-stone-500">未找到 skill: ' + skillId + '</p><a href="index.html" class="text-orange-600 underline">返回首页</a>';
    return;
  }
  
  document.title = currentSkill.name + ' - UI Skills Gallery';
  renderSkillHero();
  currentTab = 'reviews';
  renderTabs();
  renderTabContent();
  lucide.createIcons();
}



document.addEventListener('DOMContentLoaded', function() {
  init();
});

function parseStars(n) { if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k'; return n.toString(); }
function ghStarIcon(size = 'w-3.5 h-3.5') { return `<svg class="${size} gh-star" viewBox="0 0 16 16"><use href="#gh-star"/></svg>`; }

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const bg = type === 'success' ? 'bg-ink-900' : type === 'error' ? 'bg-red-600' : 'bg-ink-700';
  toast.className = `toast ${bg} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2`;
  toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${msg}</span>`;
  container.appendChild(toast);
  lucide.createIcons();
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(8px)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 2200);
}

function copyToClipboard(text, msg = '已复制到剪贴板') {
  navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); showToast(msg);
  });
}

const STORAGE_KEY = 'ui_skills_gallery_practice_records';

function getRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }
function getSkillRecords(id) { const r = getRecords(); return r[id] || []; }

function addSkillRecord(id, rec) { const r = getRecords(); if (!r[id]) r[id] = []; r[id].unshift(rec); saveRecords(r); }
function deleteSkillRecord(id, idx) { const r = getRecords(); if (r[id]) { r[id].splice(idx, 1); saveRecords(r); } }
function relativeTime(s) { const diff = Math.floor((new Date() - new Date(s)) / 1000); if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60)+' 分钟前'; if (diff < 86400) return Math.floor(diff/3600)+' 小时前'; if (diff < 2592000) return Math.floor(diff/86400)+' 天前'; return new Date(s).toLocaleDateString('zh-CN'); }

function renderSkillsGrid(sortBy = 'default') {
  const grid = document.getElementById('skillsGrid');
  let sorted = [...skills];
  if (sortBy === 'stars-desc') sorted.sort((a, b) => b.stars - a.stars);
  else if (sortBy === 'stars-asc') sorted.sort((a, b) => a.stars - b.stars);
  else if (sortBy === 'name-az') sorted.sort((a, b) => a.name.localeCompare(b.name));

  grid.innerHTML = sorted.map(skill => `
    <div class="card-hover bg-white rounded-xl2 border border-ink-200 p-5 cursor-pointer animate-fade-in" onclick="openModal('${skill.id}')">
      <div class="flex items-start justify-between mb-3">
        <div class="w-10 h-10 rounded-xl bg-ink-900 flex items-center justify-center shrink-0">
          <i data-lucide="${skill.id === 'shadcn-ui' ? 'layers' : skill.id === 'ui-ux-pro-max' ? 'palette' : 'sparkles'}" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-[11px] font-mono text-ink-400">${skill.version}</span>
      </div>
      <h3 class="font-semibold text-[15px] tracking-tight mb-1.5">${skill.name}</h3>
      <span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-md bg-accent-50 text-accent-700 border border-accent-100 mb-3">${skill.category}</span>
      <p class="text-xs text-ink-500 leading-relaxed mb-4 line-clamp-2">${skill.triggerSummary}</p>
      <div class="flex flex-wrap gap-1.5 mb-4">
        ${skill.capabilities.slice(0, 4).map(c => `<span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-ink-100 text-ink-600">${c}</span>`).join('')}
        ${skill.capabilities.length > 4 ? `<span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-ink-100 text-ink-400">+${skill.capabilities.length - 4}</span>` : ''}
      </div>
      <div class="flex items-center justify-between pt-3 border-t border-ink-100">
        <div class="flex items-center gap-1.5 text-xs text-ink-500">
          ${ghStarIcon('w-3.5 h-3.5')}
          <span class="font-mono font-medium">${parseStars(skill.stars)}</span>
        </div>
        <span class="text-xs text-ink-400 flex items-center gap-1">查看详情 <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

function openModal(skillId) {
  currentSkill = skills.find(s => s.id === skillId);
  if (!currentSkill) return;
  currentTab = 'reviews'; currentRating = 0; currentImages = [];

  document.getElementById('modalCategory').textContent = currentSkill.category;
  document.getElementById('modalVersion').textContent = currentSkill.version;
  document.getElementById('modalTitle').textContent = currentSkill.name;
  document.getElementById('modalGithub').href = currentSkill.github;
  document.getElementById('modalStars').textContent = parseStars(currentSkill.stars);
  document.getElementById('modalTrigger').textContent = currentSkill.officialIntro || currentSkill.triggerSummary;
  const plainDescWrap = document.getElementById('modalPlainDescWrap');
  const plainDescEl = document.getElementById('modalPlainDesc');
  if (currentSkill.plainDesc) {
    plainDescEl.textContent = currentSkill.plainDesc;
    plainDescWrap.classList.remove('hidden');
  } else {
    plainDescWrap.classList.add('hidden');
  }
  const suitableWrap = document.getElementById('modalSuitableWrap');
  const suitableList = document.getElementById('modalSuitableList');
  if (currentSkill.suitableFor && currentSkill.suitableFor.length) {
    suitableList.innerHTML = currentSkill.suitableFor.map(s => `
      <span class="group relative inline-flex items-center px-2 py-1 rounded-md bg-ink-100/60 border border-ink-200 text-[11px] font-medium text-ink-700 cursor-default hover:bg-accent-50 hover:border-accent-200 hover:text-accent-700 transition-colors">
        ${s.type}
        <span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 px-2 py-1 rounded bg-ink-800 text-white text-[10px] whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity z-50">${s.desc}</span>
      </span>`).join('');
    suitableWrap.classList.remove('hidden');
  } else {
    suitableWrap.classList.add('hidden');
  }

  // 官网链接
  const websiteEl = document.getElementById('modalWebsite');
  if (currentSkill.website) {
    websiteEl.href = currentSkill.website;
    websiteEl.classList.remove('hidden');
    websiteEl.classList.add('flex');
  } else {
    websiteEl.classList.add('hidden');
    websiteEl.classList.remove('flex');
  }

  renderTabs(); renderTabContent();
  document.getElementById('detailModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  lucide.createIcons();
}

function renderTabs() {
  const visibleTabs = tabs.filter(t => t.id !== 'subskills' || (currentSkill && currentSkill.subSkills && currentSkill.subSkills.length > 0));
  const inner = document.querySelector('#tabsBar .tabs-inner');
  if (inner) {
    inner.innerHTML = visibleTabs.map(tab => `
      <button onclick="switchTab('${tab.id}')" class="tab-btn ${currentTab === tab.id ? 'active' : ''}">
        <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i>${tab.label}
      </button>`).join('');
  }
}
function switchTab(tabId) { currentTab = tabId; renderTabs(); renderTabContent(); lucide.createIcons(); }

function renderTabContent() {
  const c = document.getElementById('tabContent');
  switch (currentTab) {
    case 'reviews': c.innerHTML = renderReviews(); break;
    case 'subskills': c.innerHTML = renderSubSkills(); break;
    case 'demos': c.innerHTML = renderDemos(); break;
    case 'workflow': c.innerHTML = renderWorkflow(); break;
    case 'usage': c.innerHTML = renderUsage(); break;
    case 'practice': c.innerHTML = renderPractice(); break;
  }
  lucide.createIcons();
  if (currentTab === 'practice') initPracticeTab();
}

  const avg = records.length > 0 ? (records.reduce((s,r)=>s+r.rating,0)/records.length).toFixed(1) : '—';
  return `<div class="animate-fade-in max-w-4xl">
    ${records.length===0 ? `
      <div class="text-center py-12">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-ink-100 flex items-center justify-center"><i data-lucide="star" class="w-6 h-6 text-ink-400"></i></div>
        <h4 class="text-base font-semibold text-ink-800 mb-1.5">还没有实践记录</h4>
        <p class="text-sm text-ink-500 mb-5">使用过这个技能后，来打个分并记录你的体验吧</p>
        <button onclick="scrollToRating()" class="inline-flex items-center gap-2 px-4 py-2 bg-ink-900 text-white text-sm font-medium rounded-lg hover:bg-ink-800 transition-colors"><i data-lucide="edit-3" class="w-4 h-4"></i>开始打分</button>
      </div>` : `
      <div class="flex items-center gap-6 mb-6 bg-white rounded-xl2 border border-ink-200 p-4">
        <div class="text-center"><div class="text-3xl font-bold">${records.length}</div><div class="text-[11px] text-ink-400">记录总数</div></div>
        <div class="w-px h-10 bg-ink-200"></div>
        <div class="text-center">
          <div class="text-3xl font-bold flex items-center gap-2">${avg}
            <div class="flex items-center gap-0.5">
              ${Array.from({length:5},(_,i)=>`<svg class="w-4 h-4 ${i<Math.round(avg)?'gh-star':''}" style="${i>=Math.round(avg)?'fill:#e7e5e4':''}" viewBox="0 0 16 16"><use href="#gh-star"/></svg>`).join('')}
            </div>
          </div>
          <div class="text-[11px] text-ink-400">平均评分</div>
        </div>
      </div>
      <div class="space-y-3 mb-8">
        ${records.map((r,i)=>`
          <div class="bg-white rounded-xl2 border border-ink-200 p-4 hover:border-ink-300 transition-colors">
            <div class="flex gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-3 mb-2">
                  <div class="flex items-center gap-1.5">
                    ${Array.from({length:5},(_,si)=>`<svg class="w-3.5 h-3.5 ${si<r.rating?'gh-star':''}" style="${si>=r.rating?'fill:#e7e5e4':''}" viewBox="0 0 16 16"><use href="#gh-star"/></svg>`).join('')}
                    <span class="text-[11px] text-ink-400 ml-1">${relativeTime(r.date)}</span>
                  </div>
                  <button onclick="deleteRecord(${i})" class="text-ink-300 hover:text-red-500 transition-colors p-1 shrink-0"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
                ${r.text?`<p class="text-sm text-ink-600 leading-relaxed">${r.text}</p>`:'<p class="text-sm text-ink-400 italic">未填写评价内容</p>'}
              </div>
              ${r.images&&r.images.length>0?`<div class="shrink-0 flex flex-col gap-2">${r.images.filter(Boolean).map(img=>`<img src="${img}" alt="实践截图" class="w-24 h-24 object-cover rounded-lg border border-ink-200 cursor-pointer hover:opacity-80 hover:scale-[1.02] transition-all" onclick="openLightbox('${img}')">`).join('')}</div>`:''}
            </div>
          </div>`).join('')}
      </div>`}
    <div id="ratingForm" class="bg-white rounded-xl2 border border-ink-200 p-5">
      <h4 class="text-sm font-semibold text-ink-800 mb-4 flex items-center gap-2"><i data-lucide="pen-line" class="w-4 h-4 text-ink-500"></i>记录你的实践</h4>
      <div class="mb-4"><label class="text-[11px] font-semibold text-ink-500 block mb-2">评分</label>
        <div class="flex items-center gap-1" id="starRating">
          ${Array.from({length:5},(_,i)=>`<button onclick="setRating(${i+1})" class="star-btn p-0.5" data-star="${i+1}"><svg class="w-7 h-7 text-ink-200" style="fill:#e7e5e4" viewBox="0 0 16 16"><use href="#gh-star"/></svg></button>`).join('')}
          <span id="ratingLabel" class="text-xs text-ink-400 ml-2">点击星星评分</span>
        </div>
      </div>
      <div class="mb-4"><label class="text-[11px] font-semibold text-ink-500 block mb-2">评价（可选）</label>
        <textarea id="reviewText" rows="3" placeholder="记录使用这个技能的体验、效果、遇到的问题..." class="w-full px-3.5 py-2.5 text-sm bg-ink-50 border border-ink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500/20 focus:border-accent-500 transition-colors resize-none"></textarea>
      </div>
      <div class="mb-5"><label class="text-[11px] font-semibold text-ink-500 block mb-2">添加图片（可选，支持点击、拖拽、粘贴板截图 Ctrl+V / Cmd+V，可多选）</label>
        <div id="imageDropZone" class="relative border-2 border-dashed border-ink-200 rounded-lg p-4 cursor-pointer hover:border-ink-300 hover:bg-ink-50/50 transition-all" onclick="document.getElementById('multiFileInput').click()">
          <input type="file" id="multiFileInput" accept="image/*" multiple class="hidden" onchange="handleMultiFileUpload(this)">
          <div id="dropZonePlaceholder" class="text-center py-6 text-ink-400">
            <i data-lucide="upload-cloud" class="w-8 h-8 mx-auto mb-2"></i>
            <p class="text-xs font-medium">点击选择、拖拽图片到此处，或直接粘贴截图</p>
            <p class="text-[10px] text-ink-400 mt-1">支持 JPG、PNG、GIF、WebP，可一次选择多张</p>
          </div>
          <div id="imagePreviewGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 hidden"></div>
        </div>
      </div>
      <button onclick="submitReview()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-ink-900 text-white text-sm font-medium rounded-lg hover:bg-ink-800 transition-colors"><i data-lucide="send" class="w-4 h-4"></i>提交评价</button>
    </div>
  </div>`;
}

function initPracticeTab() {
  document.addEventListener('paste', handlePaste);
  
  // 拖拽上传
  const dropZone = document.getElementById('imageDropZone');
  if (dropZone) {
    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('border-accent-500', 'bg-accent-50/30');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('border-accent-500', 'bg-accent-50/30');
      });
    });
    dropZone.addEventListener('drop', e => {
      const files = Array.from(e.dataTransfer?.files || []);
      files.forEach(f => {
        if (!f.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = ev => {
          currentImages.push(ev.target.result);
          renderImagePreview();
        };
        reader.readAsDataURL(f);
      });
      if (files.length > 0) showToast(`已添加 ${files.length} 张图片`);
    });
  }
}
function handlePaste(e) {
  if (currentTab !== 'practice') return;
  const items = e.clipboardData?.items; if (!items) return;
  let pasted = false;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      pasted = true;
      const file = item.getAsFile(), reader = new FileReader();
      reader.onload = ev => {
        currentImages.push(ev.target.result);
        renderImagePreview();
        showToast('图片已添加');
      };
      reader.readAsDataURL(file);
    }
  }
}
function handleMultiFileUpload(input) {
  const files = Array.from(input.files || []);
  if (files.length === 0) return;
  files.forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = e => {
      currentImages.push(e.target.result);
      renderImagePreview();
    };
    r.readAsDataURL(f);
  });
  input.value = '';
}
function renderImagePreview() {
  const grid = document.getElementById('imagePreviewGrid');
  const placeholder = document.getElementById('dropZonePlaceholder');
  if (!grid || !placeholder) return;
  
  if (currentImages.length === 0) {
    grid.classList.add('hidden');
    placeholder.classList.remove('hidden');
    return;
  }
  
  placeholder.classList.add('hidden');
  grid.classList.remove('hidden');
  grid.innerHTML = currentImages.map((img, idx) => `
    <div class="relative aspect-square rounded-md overflow-hidden group border border-ink-200">
      <img src="${img}" class="w-full h-full object-cover">
      <button onclick="event.stopPropagation();removeImage(${idx})" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-ink-900/70 text-white flex items-center justify-center hover:bg-ink-900 transition-colors z-10 opacity-0 group-hover:opacity-100">
        <i data-lucide="x" class="w-3 h-3"></i>
      </button>
      <span class="absolute bottom-1 left-1 text-[9px] bg-ink-900/70 text-white px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity">${idx+1}</span>
    </div>
  `).join('');
  lucide.createIcons();
}

function removeImage(idx) {
  currentImages.splice(idx, 1);
  renderImagePreview();
}
function removeImage(idx){currentImages[idx]=null;updateImageSlot(idx);}
function setRating(rating) {
  currentRating=rating;
  const stars=document.querySelectorAll('#starRating .star-btn svg');
  const labels=['很差','较差','一般','满意','非常满意'];
  stars.forEach((s,i)=>{ if(i<rating){s.classList.remove('text-ink-200');s.classList.add('gh-star');s.style.fill='';}else{s.classList.add('text-ink-200');s.classList.remove('gh-star');s.style.fill='#e7e5e4';} });
  document.getElementById('ratingLabel').textContent=labels[rating-1];
}
function submitReview() {
  if(currentRating===0){showToast('请先选择评分','error');return;}
  const text=document.getElementById('reviewText').value.trim();
  const images=currentImages.filter(Boolean);
  addSkillRecord(currentSkill.id,{rating:currentRating,text,images,date:new Date().toISOString()});
  showToast('评价已保存');
  currentRating=0;currentImages=[null,null];
  renderTabContent();
}
function deleteRecord(idx){deleteSkillRecord(currentSkill.id,idx);showToast('记录已删除');renderTabContent();}
function scrollToRating(){setTimeout(()=>{const f=document.getElementById('ratingForm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});},100);}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.remove('hidden');document.getElementById('lightbox').classList.add('flex');}
function closeLightbox(){document.getElementById('lightbox').classList.add('hidden');document.getElementById('lightbox').classList.remove('flex');}

document.addEventListener('DOMContentLoaded',()=>{
  renderSkillsGrid();
  document.getElementById('skillCount').textContent=skills.length+' skills';
  document.getElementById('sortSelect').addEventListener('change',e=>renderSkillsGrid(e.target.value));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!document.getElementById('lightbox').classList.contains('hidden'))closeLightbox();  } });
  lucide.createIcons();
});
</script>
</body>
</html>
