<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Atelier — 米其林餐厅</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { background: rgba(255,255,255,0.95); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav { display: flex; gap: 24px; }
.card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
.btn { padding: 12px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-outline { padding: 12px 32px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.gradient-text { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feature-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
.feature-icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">L'Atelier</div>
    <nav class="nav"><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">菜单</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">餐厅环境</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">厨师团队</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">预订</a></nav>
  </div>
  <div class="card" style="text-align:center;padding:80px 40px;">
  <h1 class="gradient-text" style="font-size:44px;font-weight:800;margin-bottom:16px;font-style:italic;">L'Atelier</h1>
  <p style="font-size:17px;color:#666;margin-bottom:8px;">米其林二星 · 法式精致料理</p>
  <p style="font-size:14px;color:#999;margin-bottom:32px;">自 2008 年起，为食客呈现极致的味觉体验</p>
  <button class="btn">立即预订</button>
</div>
<div class="grid-2">
  <div class="card" style="padding:0;overflow:hidden;"><div style="height:280px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:64px;">🍽️</div></div>
  <div class="card">
    <h2 class="gradient-text" style="font-size:24px;font-weight:700;margin-bottom:20px;">主厨推荐</h2>
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eee;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:15px;font-weight:700;">松露意式烩饭</span><span style="font-size:15px;font-weight:700;color:#667eea;">¥288</span></div><p style="font-size:12px;color:#999;">意大利米 · 黑松露 · 帕玛森芝士</p></div>
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eee;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:15px;font-weight:700;">香煎鹅肝</span><span style="font-size:15px;font-weight:700;color:#667eea;">¥368</span></div><p style="font-size:12px;color:#999;">法国鹅肝 · 无花果 · 波特酒酱汁</p></div>
    <div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:15px;font-weight:700;">和牛牛排</span><span style="font-size:15px;font-weight:700;color:#667eea;">¥588</span></div><p style="font-size:12px;color:#999;">A5 和牛 · 时令蔬菜 · 红酒汁</p></div>
  </div>
</div>
<div class="card" style="text-align:center;">
  <h2 class="gradient-text" style="font-size:24px;font-weight:700;margin-bottom:16px;">主厨介绍</h2>
  <div style="width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px;">👨‍🍳</div>
  <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;">Chef Pierre Dubois</h3>
  <p style="font-size:14px;color:#666;max-width:500px;margin:0 auto;line-height:1.7;">法国蓝带厨艺学院毕业，曾在多家米其林三星餐厅工作，致力于将传统法式料理与现代创意完美融合。</p>
</div>
</div>
</body>
</html>
