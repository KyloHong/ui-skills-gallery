<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>design-taste-frontend - 高端品牌官网</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f5f3ef;color:#1a1a1a}
  .nav{position:fixed;top:0;left:0;right:0;padding:24px 48px;display:flex;justify-content:space-between;align-items:center;z-index:100;background:rgba(245,243,239,0.9);backdrop-filter:blur(10px)}
  .nav-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;letter-spacing:0.05em}
  .nav-links{display:flex;gap:32px}
  .nav-links a{font-size:13px;color:#666;text-decoration:none;letter-spacing:0.05em}
  .hero{padding:160px 48px 120px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .hero-label{font-size:11px;color:#999;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:24px}
  .hero h1{font-family:'Playfair Display',serif;font-size:80px;font-weight:400;line-height:1.1;letter-spacing:-0.02em;margin-bottom:32px;max-width:800px}
  .hero h1 em{font-style:italic;color:#8b7355}
  .hero p{font-size:16px;color:#666;max-width:500px;line-height:1.8;font-weight:300}
  .collection{padding:100px 48px}
  .collection h2{font-family:'Playfair Display',serif;font-size:36px;font-weight:400;margin-bottom:48px;letter-spacing:-0.01em}
  .collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .collection-item{cursor:pointer}
  .collection-img{aspect-ratio:3/4;background:#e0dbd3;margin-bottom:16px;transition:transform 0.5s}
  .collection-item:hover .collection-img{transform:scale(1.02)}
  .collection-item h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;margin-bottom:4px}
  .collection-item span{font-size:12px;color:#999;letter-spacing:0.05em}
  .footer{padding:48px;border-top:1px solid #e0dbd3;display:flex;justify-content:space-between;font-size:12px;color:#999}
</style>
</head>
<body>
  <nav class="nav"><div class="nav-logo">MAISON ÉLÉGANCE</div><div class="nav-links"><a href="#">系列</a><a href="#">故事</a><a href="#">门店</a><a href="#">联系</a></div></nav>
  <section class="hero"><div class="hero-label">2026 春夏系列</div><h1>永恒的<em>优雅</em>，<br>现代的诠释</h1><p>每一件作品都承载着对工艺的敬畏和对美的追求。我们相信，真正的奢华不在于张扬，而在于细节的克制。</p></section>
  <section class="collection"><h2>精选系列</h2><div class="collection-grid">
    <div class="collection-item"><div class="collection-img" style="background:linear-gradient(135deg,#d4c5b0,#b8a88a)"></div><h3>经典系列</h3><span>12 件作品</span></div>
    <div class="collection-item"><div class="collection-img" style="background:linear-gradient(135deg,#c9b8a8,#a89888)"></div><h3>现代系列</h3><span>8 件作品</span></div>
    <div class="collection-item"><div class="collection-img" style="background:linear-gradient(135deg,#e0d8d0,#c8c0b8)"></div><h3>限量系列</h3><span>4 件作品</span></div>
  </div></section>
  <footer class="footer"><span>© 2026 Maison Élégance</span><span>巴黎 · 米兰 · 东京</span></footer>
</body>
</html>
