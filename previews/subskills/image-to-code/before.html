<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack — 健康追踪 APP</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { background: rgba(255,255,255,0.95); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav { display: flex; gap: 24px; }
.card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
.btn { padding: 12px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-outline { padding: 12px 32px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.gradient-text { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feature-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
.feature-icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">FitTrack</div>
    <nav class="nav"><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">功能</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">截图</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">评价</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">下载</a></nav>
  </div>
  <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;">
  <div>
    <h1 class="gradient-text" style="font-size:40px;font-weight:800;margin-bottom:16px;">您的健康，一目了然</h1>
    <p style="font-size:16px;color:#666;margin-bottom:24px;line-height:1.7;">FitTrack 帮您追踪运动、饮食、睡眠，全方位管理健康生活。</p>
    <div style="display:flex;gap:12px;margin-bottom:24px;"><button class="btn">App Store 下载</button><button class="btn-outline">Google Play</button></div>
    <div style="display:flex;gap:24px;"><div><div style="font-size:24px;font-weight:800;color:#667eea;">4.9</div><div style="font-size:12px;color:#999;">App Store 评分</div></div><div><div style="font-size:24px;font-weight:800;color:#667eea;">100万+</div><div style="font-size:12px;color:#999;">下载量</div></div></div>
  </div>
  <div style="height:400px;background:linear-gradient(135deg,#f093fb,#f5576c);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:80px;">📱</div>
</div>
<div class="grid-3">
  <div class="feature-card"><div class="feature-icon">🏃</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">运动追踪</h4><p style="font-size:13px;color:#666;">记录步数、卡路里、运动时长</p></div>
  <div class="feature-card"><div class="feature-icon">🥗</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">饮食记录</h4><p style="font-size:13px;color:#666;">拍照识别食物，智能计算营养</p></div>
  <div class="feature-card"><div class="feature-icon">😴</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">睡眠分析</h4><p style="font-size:13px;color:#666;">深度分析睡眠质量和周期</p></div>
</div>
</div>
</body>
</html>
