<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Chen — 自由设计师作品集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { background: rgba(255,255,255,0.95); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav { display: flex; gap: 24px; }
.card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
.btn { padding: 12px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-outline { padding: 12px 32px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.gradient-text { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feature-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
.feature-icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Alex Chen</div>
    <nav class="nav"><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">作品</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">关于</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">服务</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">联系</a></nav>
  </div>
  <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;">
  <div>
    <h1 class="gradient-text" style="font-size:42px;font-weight:800;margin-bottom:16px;">你好，我是 Alex</h1>
    <p style="font-size:16px;color:#666;margin-bottom:24px;line-height:1.7;">一名专注于 UI/UX 设计的自由设计师，致力于创造美观且实用的数字产品体验。</p>
    <div style="display:flex;gap:12px;"><button class="btn">查看作品</button><button class="btn-outline">联系我</button></div>
  </div>
  <div style="height:300px;background:linear-gradient(135deg,#f093fb,#f5576c);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:80px;">👨‍🎨</div>
</div>
<div class="grid-2">
  <div class="card" style="padding:0;overflow:hidden;"><div style="height:220px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:48px;">📱</div><div style="padding:20px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:8px;">健康 APP 设计</h3><p style="font-size:13px;color:#666;">完整的移动端用户体验设计</p></div></div>
  <div class="card" style="padding:0;overflow:hidden;"><div style="height:220px;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:48px;">💻</div><div style="padding:20px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:8px;">SaaS 平台重设计</h3><p style="font-size:13px;color:#666;">企业级数据可视化平台</p></div></div>
</div>
<div class="card">
  <h2 class="gradient-text" style="font-size:24px;font-weight:700;margin-bottom:20px;text-align:center;">我的服务</h2>
  <div class="grid-3">
    <div class="feature-card"><div class="feature-icon">🎨</div><h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">UI 设计</h4><p style="font-size:12px;color:#666;">界面视觉设计</p></div>
    <div class="feature-card"><div class="feature-icon">🧭</div><h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">UX 研究</h4><p style="font-size:12px;color:#666;">用户体验优化</p></div>
    <div class="feature-card"><div class="feature-icon">✨</div><h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">品牌设计</h4><p style="font-size:12px;color:#666;">视觉识别系统</p></div>
  </div>
</div>
</div>
</body>
</html>
