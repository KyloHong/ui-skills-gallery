<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stitch DS — 设计系统文档</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { background: rgba(255,255,255,0.95); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav { display: flex; gap: 24px; }
.card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
.btn { padding: 12px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-outline { padding: 12px 32px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.gradient-text { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feature-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
.feature-icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Stitch DS</div>
    <nav class="nav"><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">组件</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">设计规范</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">代码示例</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">更新日志</a></nav>
  </div>
  <div class="card" style="display:grid;grid-template-columns:200px 1fr;gap:32px;">
  <div>
    <div style="font-size:12px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:12px;">入门</div>
    <div style="font-size:14px;color:#667eea;font-weight:600;margin-bottom:8px;padding:8px 12px;background:#f0f0ff;border-radius:6px;">快速开始</div>
    <div style="font-size:14px;color:#666;margin-bottom:8px;padding:8px 12px;">安装配置</div>
    <div style="font-size:14px;color:#666;margin-bottom:16px;padding:8px 12px;">设计原则</div>
    <div style="font-size:12px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:12px;">组件</div>
    <div style="font-size:14px;color:#666;margin-bottom:8px;padding:8px 12px;">按钮 Button</div>
    <div style="font-size:14px;color:#666;margin-bottom:8px;padding:8px 12px;">输入框 Input</div>
    <div style="font-size:14px;color:#666;margin-bottom:8px;padding:8px 12px;">卡片 Card</div>
    <div style="font-size:14px;color:#666;padding:8px 12px;">模态框 Modal</div>
  </div>
  <div>
    <div style="font-size:12px;color:#999;margin-bottom:8px;">入门 / 快速开始</div>
    <h1 class="gradient-text" style="font-size:32px;font-weight:800;margin-bottom:16px;">快速开始</h1>
    <p style="font-size:15px;color:#666;margin-bottom:24px;line-height:1.7;">Stitch DS 是一套现代化的设计系统，帮助您快速构建一致、美观的用户界面。</p>
    <div style="background:#1a1a2e;color:#e4e4e7;padding:20px;border-radius:10px;font-family:monospace;font-size:13px;margin-bottom:24px;">npm install @stitch-ds/react</div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:16px;">按钮示例</h2>
    <div style="display:flex;gap:12px;margin-bottom:24px;"><button class="btn">主要按钮</button><button class="btn-outline">次要按钮</button></div>
  </div>
</div>
</div>
</body>
</html>
