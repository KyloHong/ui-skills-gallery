<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevKit — 开发者效率工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { background: rgba(255,255,255,0.95); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav { display: flex; gap: 24px; }
.card { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
.btn { padding: 12px 32px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-outline { padding: 12px 32px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.gradient-text { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feature-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
.feature-icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">DevKit</div>
    <nav class="nav"><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">功能</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">文档</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">定价</a><a href="#" style="color:#666;text-decoration:none;font-size:14px;font-weight:500;">GitHub</a></nav>
  </div>
  <div class="card" style="text-align:center;padding:80px 40px;">
  <h1 class="gradient-text" style="font-size:42px;font-weight:800;margin-bottom:16px;">让开发更高效</h1>
  <p style="font-size:17px;color:#666;margin-bottom:24px;">一站式开发者工具集，提升您的编码效率</p>
  <div style="display:flex;gap:12px;justify-content:center;"><button class="btn">免费开始</button><button class="btn-outline">查看文档</button></div>
</div>
<div class="card" style="background:#1a1a2e;color:#e4e4e7;">
  <div style="display:flex;gap:8px;margin-bottom:16px;"><div style="width:12px;height:12px;border-radius:50%;background:#ff5f57;"></div><div style="width:12px;height:12px;border-radius:50%;background:#febc2e;"></div><div style="width:12px;height:12px;border-radius:50%;background:#28c840;"></div></div>
  <pre style="font-family:monospace;font-size:13px;line-height:1.8;">$ npm install -g devkit-cli
$ devkit init my-project
✓ 项目初始化完成
✓ 依赖安装完成
✓ Git 仓库已创建
$ devkit dev
🚀 开发服务器已启动: http://localhost:3000</pre>
</div>
<div class="grid-3">
  <div class="feature-card"><div class="feature-icon">⚡</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">极速构建</h4><p style="font-size:13px;color:#666;">比传统工具快 10 倍的构建速度</p></div>
  <div class="feature-card"><div class="feature-icon">🔌</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">插件生态</h4><p style="font-size:13px;color:#666;">丰富的插件系统，按需扩展</p></div>
  <div class="feature-card"><div class="feature-icon">📝</div><h4 style="font-size:15px;font-weight:700;margin-bottom:8px;">智能提示</h4><p style="font-size:13px;color:#666;">AI 驱动的代码补全和建议</p></div>
</div>
</div>
</body>
</html>
